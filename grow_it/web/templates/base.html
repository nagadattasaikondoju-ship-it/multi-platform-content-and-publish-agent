<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Grow it — one idea, one loop, thirteen platforms{% endblock %}</title>
  <meta name="description" content="{% block description %}Grow it turns one topic, draft or link into thirteen platform-native posts, checks every limit, and publishes on a schedule you approve once.{% endblock %}">
  <meta name="robots" content="{% block robots %}index, follow{% endblock %}">
  {% if site_url %}
  <link rel="canonical" href="{{ site_url }}{{ request.url.path }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Grow it">
  <meta property="og:url" content="{{ site_url }}{{ request.url.path }}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:image" content="{{ site_url }}/static/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ self.title() }}">
  <meta name="twitter:description" content="{{ self.description() }}">
  <meta name="twitter:image" content="{{ site_url }}/static/img/og.png">
  {% endif %}
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/grow.css">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/js/grow.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
